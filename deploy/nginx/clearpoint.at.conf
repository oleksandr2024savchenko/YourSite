# ClearPoint static site (Next.js export in /var/www/clearpoint)
# Install: copy to /etc/nginx/sites-available/clearpoint.at
#          ln -s /etc/nginx/sites-available/clearpoint.at /etc/nginx/sites-enabled/
# HTTPS:   certbot --nginx -d clearpoint.at -d www.clearpoint.at

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.clearpoint.at;
    return 301 $scheme://clearpoint.at$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name clearpoint.at;

    root /var/www/clearpoint;
    index index.html;

    # Hashed build assets: cache forever
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # trailingSlash: true -> every page is a directory with index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;
}
