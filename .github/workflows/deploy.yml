name: Redirect GitHub Pages to clearpoint.at

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare redirect site
        run: |
          mkdir -p redirect-site
          cp deploy/github-pages-redirect/index.html redirect-site/index.html
          cp deploy/github-pages-redirect/index.html redirect-site/404.html
          cp deploy/github-pages-redirect/robots.txt redirect-site/robots.txt
          touch redirect-site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect-site
          publish_branch: gh-pages
          force_orphan: true
