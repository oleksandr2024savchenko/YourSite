name: Deploy preview to GitHub Pages

# Builds the full site as a static export and publishes it to the gh-pages
# branch: https://oleksandr2024savchenko.github.io/YourSite/
# The preview is marked noindex so it never competes with the main domain.
on:
  push:
    branches: [main, claude/bold-feynman-52ayl5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_ORIGIN: "https://oleksandr2024savchenko.github.io"
          NEXT_PUBLIC_NOINDEX: "true"
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
